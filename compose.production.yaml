services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        image: fruit-shop-app
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - internal
        volumes:
            - app-storage:/var/www/html/storage

    web:
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        image: fruit-shop-web
        restart: unless-stopped
        depends_on:
            - app
        volumes:
            - app-storage:/var/www/html/storage:ro
        networks:
            internal:
            reverse-proxy:
                aliases:
                    - fruit-shop

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - internal
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - -h
                - localhost
                - -p${DB_ROOT_PASSWORD}
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:alpine
        restart: unless-stopped
        volumes:
            - redis-data:/data
        networks:
            - internal
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    internal:
        driver: bridge

    reverse-proxy:
        external: true
        name: reverse-proxy

volumes:
    mysql-data:
    redis-data:
    app-storage: