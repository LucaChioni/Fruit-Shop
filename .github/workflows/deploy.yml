name: CI

on:
  push:
    branches: [ "main" ]

  workflow_call:
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true

  workflow_dispatch:

jobs:
  test:
    name: Test Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Installa le dipendenze PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara Laravel per i test
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Esegui i test Laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

  build:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy sul server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/fruit-shop
            git pull

            docker compose -f compose.production.yaml up -d --build --remove-orphans

            docker compose -f compose.production.yaml exec -T app php artisan migrate --force
            docker compose -f compose.production.yaml exec -T app php artisan db:seed --force
            docker compose -f compose.production.yaml exec -T app php artisan optimize:clear
            docker compose -f compose.production.yaml exec -T app php artisan optimize

            docker system prune -f
