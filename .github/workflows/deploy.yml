name: CI

on:
  push:
    branches: [ "main" ]

  # allows you to run this workflow from other repositories
  workflow_call:
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true

  # allows you to run this workflow manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy sul server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/fruit-shop
            git pull

            docker compose -f compose.production.yaml up -d --build --remove-orphans
            docker system prune -f

            docker compose -f compose.production.yaml exec app php artisan migrate --force
            docker compose -f compose.production.yaml exec app php artisan db:seed --force
            docker compose -f compose.production.yaml exec app php artisan optimize:clear
            docker compose -f compose.production.yaml exec app php artisan optimize
